name: Windows 构建

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "src/**"
      - "src-tauri/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "vite.config.ts"
      - ".github/workflows/windows-build.yml"

permissions:
  contents: read

jobs:
  build-windows:
    name: 构建 Windows 安装包
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 配置 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: 配置 Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version

      - name: 安装前端依赖
        run: npm ci

      - name: 构建 Tauri 应用
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .ci | Out-Null
          npm run tauri:build 2>&1 | Tee-Object -FilePath .ci/tauri-build.log
          $buildExitCode = $LASTEXITCODE
          if ($buildExitCode -ne 0) {
            exit $buildExitCode
          }

      - name: 发布构建错误注解
        if: failure()
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath .ci/tauri-build.log)) {
            Write-Output "::error title=Tauri 构建失败::构建日志文件不存在"
            exit 0
          }

          $tail = (Get-Content -LiteralPath .ci/tauri-build.log -Tail 100) -join "`n"
          $escaped = $tail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
          Write-Output "::error title=Tauri 构建失败::$escaped"

      - name: 上传 Windows 安装包
        uses: actions/upload-artifact@v4
        with:
          name: desktop-pet-windows
          path: |
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
          if-no-files-found: error
          retention-days: 14
